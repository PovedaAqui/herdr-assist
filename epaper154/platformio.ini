; herdr-assist para o Waveshare ESP32-S3-ePaper-1.54 (e-paper 200x200 mono,
; dois botoes, codec ES8311, RTC PCF85063): o pager.
;
; Projeto separado do painel de 3,5", como o cardputer/. Aqui tambem e
; ESP-IDF, e na mesma versao do painel (espressif32@6.6.0 = IDF 5.2.1), entao
; reaproveita mais que o Cardputer: alem do protocolo e do estado, herda
; net.c (Wi-Fi), pairing.c e fw_update.c (OTA) — ver scripts/sync_shared.py.
;
; Dependencias de terceiros so pelo component manager (src/idf_component.yml):
; espressif/esp_lcd_ssd1681 (painel) e espressif/esp_codec_dev (sino).
;
; Duas revisoes da placa, um env para cada: a diferenca e o modo da PSRAM
; (sdkconfig.defaults.v1/.v2). Na duvida, e a V2 (silk "V2" na placa).

[platformio]
description = herdr-assist ESP32-S3-ePaper-1.54
default_envs = epaper154, epaper154-v1
boards_dir = boards
src_dir = src

[com]
platform = espressif32@6.6.0
framework = espidf
board = esp32s3-epaper154
board_build.partitions = partitions.csv
monitor_filters = esp32_exception_decoder
monitor_speed = 115200
build_flags =
	; a tela e 200x200 mono: nada de terminal, mas o JSON de `agents` e o
	; mesmo do painel — o buffer de RX do protocolo fica no default dele
	-DHERDR_RX_BUF_LEN=16384
; unico extra_script: copia os modulos compartilhados, carimba a versao
; (HERDR_ASSIST_VERSION) e aponta o OTA para o manifest deste device
extra_scripts = pre:scripts/sync_shared.py

[env:epaper154]
platform = ${com.platform}
framework = ${com.framework}
board = ${com.board}
board_build.partitions = ${com.board_build.partitions}
board_build.cmake_extra_args = -DPAGER_VARIANT=v2
monitor_filters = ${com.monitor_filters}
monitor_speed = ${com.monitor_speed}
build_flags = ${com.build_flags}
extra_scripts = ${com.extra_scripts}

[env:epaper154-v1]
platform = ${com.platform}
framework = ${com.framework}
board = ${com.board}
board_build.partitions = ${com.board_build.partitions}
board_build.cmake_extra_args = -DPAGER_VARIANT=v1
monitor_filters = ${com.monitor_filters}
monitor_speed = ${com.monitor_speed}
build_flags = ${com.build_flags}
extra_scripts = ${com.extra_scripts}
